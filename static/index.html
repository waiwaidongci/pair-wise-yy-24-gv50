<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>电台排程</title>
<style>
body{font:15px system-ui;max-width:1100px;margin:24px auto;padding:0 16px;background:#f7f7f5;color:#222}
section{background:white;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}
input,select,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}
button{cursor:pointer;background:#16324f;color:white}
button.warn{background:#8a4b1f}
pre{white-space:pre-wrap;max-height:360px;overflow:auto}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input{width:90%}
table{border-collapse:collapse;width:100%;margin-top:8px}
th,td{border:1px solid #ddd;padding:5px 8px;text-align:left;font-size:14px}
th{background:#eef2f6}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;color:white}
.badge.locked{background:#8a4b1f}.badge.open{background:#3a7d44}
.action-locked{color:#8a4b1f}.action-unlocked{color:#3a7d44}
.muted{color:#777;font-size:13px}
h2{margin-top:0}
</style>
<h1>电台播出与版权窗口排程</h1>
<section><h2>当前计划 <button onclick="load()">刷新</button></h2>
<table id="slots"><thead><tr>
<th>日期</th><th>地区</th><th>开始</th><th>时长</th><th>排期 #</th><th>节目</th><th>状态</th><th>节目单</th>
</tr></thead><tbody></tbody></table>
<p class="muted" id="slotsempty" hidden>暂无排期</p>
</section>
<section><h2>节目单锁定</h2>
<div class="grid">
<input id="lockdate" value="2026-09-28" placeholder="日期 YYYY-MM-DD">
<input id="lockregion" value="华东" placeholder="地区">
<input id="lockoperator" placeholder="操作人（锁定/解锁人）">
<input id="unlockreason" placeholder="解锁原因（解锁必填）">
</div>
<button onclick="lockSchedule()">锁定节目单</button>
<button class="warn" onclick="unlockSchedule()">解锁（需填原因）</button>
<p class="muted">锁定后该日期+地区的新建排期和替换会被拒绝；实播登记不受影响。历史记录始终保留，解锁后可重新锁定。</p>
<h3>当前锁定状态</h3>
<table id="locks"><thead><tr><th>日期</th><th>地区</th><th>状态</th><th>锁定人</th><th>锁定时间</th></tr></thead><tbody></tbody></table>
<p class="muted" id="locksempty">没有锁定中的节目单</p>
<h3>最近操作</h3>
<table id="recent"><thead><tr><th>时间</th><th>日期</th><th>地区</th><th>操作</th><th>操作人</th><th>原因</th></tr></thead><tbody></tbody></table>
<h3>锁定 / 解锁历史</h3>
<table id="history"><thead><tr><th>时间</th><th>日期</th><th>地区</th><th>操作</th><th>操作人</th><th>原因</th></tr></thead><tbody></tbody></table>
</section>
<section><h2>新建节目</h2><div class="grid">
<input id="title" placeholder="节目名"><select id="kind"><option>music</option><option>ad</option><option>talk</option><option>live</option></select>
<input id="duration" type="number" value="30" placeholder="分钟"><input id="start" value="2026-01-01"><input id="end" value="2026-12-31">
<input id="region" value="华东"><input id="sponsor" placeholder="赞助商，可空"><input id="cooldown" type="number" value="0" placeholder="冷却分钟">
</div><button onclick="addProgram()">创建并授权地区</button></section>
<section><h2>排期 / 替换 / 实播对账</h2>
<div class="grid"><input id="airdate" value="2026-09-28"><input id="starttime" value="12:00"><input id="pid" type="number" placeholder="节目 ID">
<input id="sid" type="number" placeholder="排期 ID"><input id="newpid" type="number" placeholder="替换节目 ID"><input id="actualstart" value="12:00">
<input id="actualduration" type="number" value="30" placeholder="实播分钟"><input id="actualpid" type="number" placeholder="实播节目 ID，可空"></div>
<button onclick="schedule()">排期</button><button onclick="replace()">替换</button><button onclick="playout()">记录实播</button><button onclick="reconcile()">对账</button><pre id="result"></pre></section>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ts=>ts?ts.replace('T',' ').slice(0,19):'';
function actionText(a){return a==='locked'?'<span class="action-locked">锁定</span>':'<span class="action-unlocked">解锁</span>'}
function actionTable(id,rows){
  document.querySelector('#'+id+' tbody').innerHTML=rows.map(r=>
    `<tr><td>${fmt(r.created_at)}</td><td>${esc(r.air_date)}</td><td>${esc(r.region)}</td>`+
    `<td>${actionText(r.action)}</td><td>${esc(r.operator)}</td><td>${esc(r.reason)}</td></tr>`).join('');
}
function render(state){
  const locks=state.locks||[], lockSet=new Set(locks.map(l=>l.air_date+'|'+l.region));
  document.querySelector('#slots tbody').innerHTML=(state.slots||[]).map(s=>
    `<tr><td>${esc(s.air_date)}</td><td>${esc(s.region)}</td><td>${esc(s.start_time)}</td>`+
    `<td>${s.duration_minutes}</td><td>${s.id}</td><td>#${s.program_id} ${esc(s.title)}</td>`+
    `<td>${esc(s.status)}</td>`+
    `<td>${s.locked?'<span class="badge locked">已锁定</span>':'<span class="badge open">未锁定</span>'}</td></tr>`).join('');
  document.querySelector('#slotsempty').hidden=(state.slots||[]).length>0;
  document.querySelector('#locks tbody').innerHTML=locks.map(l=>
    `<tr><td>${esc(l.air_date)}</td><td>${esc(l.region)}</td>`+
    `<td><span class="badge locked">已锁定</span></td><td>${esc(l.operator)}</td><td>${fmt(l.locked_at)}</td></tr>`).join('');
  document.querySelector('#locksempty').hidden=locks.length>0;
  actionTable('recent',state.recent_lock_actions||[]);
  actionTable('history',state.lock_history||[]);
}
async function load(){render(await (await fetch('/api/state')).json())}
async function api(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json();
  out(j);
  if(j.state)render(j.state);else load();
  return j;
}
const out=x=>document.querySelector('#result').textContent=JSON.stringify(x,null,2);
function addProgram(){api('/api/programs',{title:title.value,kind:kind.value,duration_minutes:+duration.value,start_date:start.value,end_date:end.value,region:region.value,regions:[region.value],sponsor:sponsor.value||null,cooldown_minutes:+cooldown.value})}
function schedule(){api('/api/schedule',{air_date:airdate.value,start_time:starttime.value,program_id:+pid.value,region:region.value})}
function replace(){api('/api/slots/'+sid.value+'/replace',{new_program_id:+newpid.value})}
function playout(){api('/api/playout',{slot_id:+sid.value,actual_start:actualstart.value,actual_duration_minutes:+actualduration.value,actual_program_id:actualpid.value?+actualpid.value:null})}
function reconcile(){api('/api/reconcile',{date:airdate.value})}
function lockSchedule(){api('/api/schedule/lock',{air_date:lockdate.value,region:lockregion.value,operator:lockoperator.value})}
function unlockSchedule(){api('/api/schedule/unlock',{air_date:lockdate.value,region:lockregion.value,operator:lockoperator.value,reason:unlockreason.value})}
load();
</script>
</html>
